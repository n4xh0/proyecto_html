<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Ingresar | El Terremoto</title><link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"><style>

  :root{
    --crema: #F3E7CE;
    --crema-alta: #FBF3E1;
    --tinta: #2B2018;
    --tinta-suave: #5A4B3C;
    --granadina: #A62639;
    --granadina-oscura: #7E1C2A;
    --pipeno: #C98A2E;
    --parron: #5C6B47;
    --bandera: #2C4767;
    --linea: rgba(43,32,24,0.16);
    --radio: 3px;
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--crema);
    color:var(--tinta);
    font-family:'Work Sans', sans-serif;
    line-height:1.5;
  }
  h1,h2,h3,.display{
    font-family:'Fraunces', serif;
    color:var(--tinta);
    margin:0;
    letter-spacing:-0.01em;
  }
  a{color:inherit;}
  button{font-family:inherit;}
  img{max-width:100%;display:block;}

  .wrap{
    max-width:1080px;
    margin:0 auto;
    padding:0 28px;
  }

  /* ---------- HEADER ---------- */
  header.site{
    position:sticky; top:0; z-index:50;
    background:var(--crema-alta);
    border-bottom:1px solid var(--linea);
  }
  .header-inner{
    max-width:1080px;
    margin:0 auto;
    padding:18px 28px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:24px;
  }
  .brand{
    display:flex;
    align-items:baseline;
    gap:10px;
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:22px;
  }
  .brand span.tag{
    font-family:'Work Sans', sans-serif;
    font-size:12px;
    font-weight:500;
    color:var(--tinta-suave);
    border-left:1px solid var(--linea);
    padding-left:10px;
  }
  nav.main-nav{
    display:flex;
    align-items:center;
    gap:28px;
    font-size:15px;
    font-weight:500;
  }
  nav.main-nav a, nav.main-nav button.linklike{
    background:none; border:none; cursor:pointer;
    color:var(--tinta); font-size:15px; font-weight:500; font-family:inherit;
    padding:0; text-decoration:none;
    position:relative;
  }
  nav.main-nav a:hover, nav.main-nav button.linklike:hover{ color:var(--granadina); }

  .btn{
    display:inline-flex; align-items:center; justify-content:center;
    gap:8px;
    padding:11px 22px;
    border-radius:var(--radio);
    border:1px solid transparent;
    font-weight:600;
    font-size:14px;
    cursor:pointer;
    transition:transform .12s ease, background .15s ease, border-color .15s ease;
  }
  .btn:active{ transform:translateY(1px); }
  .btn-primary{ background:var(--granadina); color:var(--crema-alta); }
  .btn-primary:hover{ background:var(--granadina-oscura); }
  .btn-ghost{ background:transparent; color:var(--tinta); border-color:var(--tinta); }
  .btn-ghost:hover{ background:var(--tinta); color:var(--crema-alta); }
  .btn-small{ padding:7px 14px; font-size:13px; }
  .btn-danger{ background:transparent; color:var(--granadina-oscura); border-color:var(--granadina-oscura); }
  .btn-danger:hover{ background:var(--granadina-oscura); color:var(--crema-alta); }

  .user-chip{
    display:flex; align-items:center; gap:10px;
    font-size:14px;
  }
  .user-chip .who{ font-weight:600; }
  .user-chip .who small{ display:block; font-weight:400; color:var(--tinta-suave); font-size:12px; }

  /* ---------- HERO ---------- */
  .hero{
    padding:64px 0 72px;
    border-bottom:1px solid var(--linea);
  }
  .hero-inner{
    display:grid;
    grid-template-columns:1.1fr 0.9fr;
    gap:56px;
    align-items:center;
  }
  .hero-eyebrow{
    font-size:14px;
    color:var(--tinta-suave);
    margin-bottom:18px;
    max-width:34ch;
  }
  .hero h1{
    font-size:clamp(40px, 5.4vw, 68px);
    line-height:1.02;
    font-weight:600;
  }
  .hero h1 em{
    font-style:italic;
    color:var(--granadina);
    font-weight:500;
  }
  .hero p.lede{
    margin-top:22px;
    font-size:18px;
    color:var(--tinta-suave);
    max-width:44ch;
  }
  .hero-actions{
    margin-top:32px;
    display:flex;
    gap:14px;
    flex-wrap:wrap;
  }
  .hero-figure{
    position:relative;
  }
  .hero-figure img{
    width:100%;
    border-radius:4px;
    box-shadow: 10px 14px 0 var(--pipeno);
  }
  .hero-figure .caption{
    margin-top:16px;
    font-size:13px;
    color:var(--tinta-suave);
    display:flex;
    justify-content:space-between;
    border-top:1px solid var(--linea);
    padding-top:10px;
  }

  /* ---------- SECTION SHARED ---------- */
  section{ padding:64px 0; border-bottom:1px solid var(--linea); }
  .section-head{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    gap:24px;
    margin-bottom:36px;
  }
  .section-head h2{
    font-size:32px;
    font-weight:600;
  }
  .section-head p{
    color:var(--tinta-suave);
    max-width:40ch;
    font-size:15px;
    margin:8px 0 0;
  }

  /* ---------- RECETA / ABOUT ---------- */
  .receta{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:0;
    border-top:1px solid var(--linea);
  }
  .receta .paso{
    padding:26px 24px;
    border-right:1px solid var(--linea);
  }
  .receta .paso:last-child{ border-right:none; }
  .receta .num{
    font-family:'Fraunces', serif;
    font-size:14px;
    color:var(--granadina);
    font-weight:600;
    margin-bottom:10px;
  }
  .receta h3{ font-size:18px; font-weight:600; margin-bottom:8px; }
  .receta p{ font-size:14px; color:var(--tinta-suave); margin:0; }

  /* ---------- MENU ---------- */
  .menu-categorias{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:8px;
  }
  .chip{
    padding:7px 14px;
    border-radius:100px;
    border:1px solid var(--linea);
    font-size:13px;
    font-weight:500;
    background:var(--crema-alta);
    cursor:pointer;
  }
  .chip.active{
    background:var(--tinta);
    color:var(--crema-alta);
    border-color:var(--tinta);
  }
  .menu-lista{ margin-top:28px; }
  .menu-item{
    display:flex;
    align-items:center;
    gap:20px;
    padding:20px 0;
    border-top:1px solid var(--linea);
  }
  .menu-lista .menu-item:last-child{ border-bottom:1px solid var(--linea); }
  .menu-item .foto{
    width:88px;
    height:88px;
    flex:none;
    border-radius:3px;
    overflow:hidden;
    background:var(--linea);
  }
  .menu-item .foto img{ width:100%; height:100%; object-fit:cover; }
  .menu-item .fila-principal{
    display:flex;
    flex:1;
    justify-content:space-between;
    align-items:baseline;
    gap:24px;
  }
  .menu-item .info{ flex:1; }
  .menu-item .fila-nombre{
    display:flex;
    align-items:baseline;
    gap:10px;
    flex-wrap:wrap;
  }
  .menu-item h3{
    font-size:19px;
    font-weight:600;
  }
  .menu-item .cat-tag{
    font-size:11px;
    text-transform:none;
    color:var(--parron);
    border:1px solid var(--parron);
    padding:2px 8px;
    border-radius:100px;
  }
  .menu-item p{
    margin:6px 0 0;
    font-size:14px;
    color:var(--tinta-suave);
    max-width:52ch;
  }
  .menu-item .precio{
    font-family:'Fraunces', serif;
    font-size:20px;
    font-weight:600;
    white-space:nowrap;
    color:var(--granadina-oscura);
  }
  .menu-item.agotado{ opacity:0.45; }
  .menu-item .agotado-tag{
    font-size:11px; color:var(--tinta-suave); display:block; margin-top:4px;
  }
  .menu-vacio{
    padding:40px 0;
    color:var(--tinta-suave);
    font-size:15px;
    border-top:1px solid var(--linea);
    border-bottom:1px solid var(--linea);
  }


  /* ---------- CARRITO DE COMPRAS ---------- */
  .btn-cart{
    position:relative;
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:var(--tinta);
    color:var(--crema-alta);
    border:1px solid var(--tinta);
    padding:8px 13px;
    border-radius:var(--radio);
    cursor:pointer;
    font-weight:600;
    font-size:13px;
  }
  .btn-cart:hover{ background:var(--granadina-oscura); border-color:var(--granadina-oscura); }
  .cart-count{
    min-width:20px;
    height:20px;
    padding:0 5px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    background:var(--granadina);
    color:#fff;
    font-size:11px;
    font-weight:700;
  }
  .cart-modal{
    max-width:560px;
    max-height:calc(100vh - 40px);
    overflow:auto;
  }
  .cart-list{ margin:22px 0; border-top:1px solid var(--linea); }
  .cart-row{
    display:grid;
    grid-template-columns:1fr auto auto;
    gap:12px;
    align-items:center;
    padding:14px 0;
    border-bottom:1px solid var(--linea);
  }
  .cart-row strong{ display:block; font-size:15px; }
  .cart-row small{ color:var(--tinta-suave); }
  .cart-qty{
    display:flex;
    align-items:center;
    gap:8px;
    border:1px solid var(--linea);
    border-radius:var(--radio);
    padding:3px;
  }
  .cart-qty button{
    width:26px; height:26px; border:0; background:transparent; cursor:pointer;
    font-size:18px; color:var(--tinta);
  }
  .cart-qty span{ min-width:18px; text-align:center; font-weight:600; }
  .cart-price{ font-family:'Fraunces',serif; font-weight:600; white-space:nowrap; }
  .cart-total{
    display:flex; justify-content:space-between; align-items:center;
    padding:18px 0; font-size:18px; font-weight:600;
  }
  .cart-total strong{ font-family:'Fraunces',serif; font-size:25px; color:var(--granadina-oscura); }
  .cart-empty{ padding:30px 0; text-align:center; color:var(--tinta-suave); }
  .add-cart{
    margin-top:10px;
  }
  .cart-footer-actions{ display:flex; justify-content:flex-end; gap:10px; flex-wrap:wrap; }
  @media (max-width:760px){
    .btn-cart{ width:100%; justify-content:center; }
    .cart-row{ grid-template-columns:1fr auto; }
    .cart-price{ grid-column:2; grid-row:1; }
    .cart-qty{ grid-column:1 / -1; width:max-content; }
  }

  /* ---------- FOOTER ---------- */
  footer{
    padding:40px 0 48px;
  }
  .footer-inner{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    flex-wrap:wrap;
    gap:18px;
  }
  footer .brand{ font-size:18px; }
  footer .meta{
    font-size:13px;
    color:var(--tinta-suave);
    text-align:right;
  }


  .overlay{
    position:fixed; inset:0;
    background:rgba(43,32,24,0.5);
    display:flex; align-items:center; justify-content:center;
    z-index:200;
    padding:20px;
  }
  .hidden{ display:none !important; }
  .modal{
    background:var(--crema-alta);
    max-width:400px;
    width:100%;
    padding:36px 32px;
    border-radius:4px;
    border:1px solid var(--linea);
  }
  #overlay-login .modal{
    position:relative;
    overflow:hidden;
    color:#fff;
  }
  #overlay-login .modal::before{
    content:"";
    position:absolute; inset:0;
    background-image:url('img/volantin.jpeg');
    background-size:cover;
    background-position:center 20%;
    z-index:0;
  }
  #overlay-login .modal::after{
    content:"";
    position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(20,14,10,0.55) 0%, rgba(20,14,10,0.86) 65%, rgba(20,14,10,0.94) 100%);
    z-index:0;
  }
  #overlay-login .modal > *{ position:relative; z-index:1; }
  #overlay-login .modal h2{ color:#fff; }
  #overlay-login .modal .sub{ color:rgba(255,255,255,0.75); }
  #overlay-login .campo label{ color:#fff; }
  #overlay-login .close-x{ color:rgba(255,255,255,0.8); }
  #overlay-login .hint-credenciales{ color:rgba(255,255,255,0.7); border-top-color:rgba(255,255,255,0.25); }
  .modal h2{ font-size:24px; margin-bottom:6px; }
  .modal .sub{ font-size:14px; color:var(--tinta-suave); margin-bottom:26px; }
  .campo{ margin-bottom:16px; }
  .campo label{
    display:block;
    font-size:13px;
    font-weight:600;
    margin-bottom:6px;
  }
  .campo input, .campo select, .campo textarea{
    width:100%;
    padding:11px 12px;
    border:1px solid var(--linea);
    border-radius:3px;
    font-size:14px;
    font-family:inherit;
    background:#fff;
    color:var(--tinta);
  }
  .campo textarea{ resize:vertical; min-height:70px; }
  .campo input:focus, .campo select:focus, .campo textarea:focus{
    outline:2px solid var(--bandera);
    outline-offset:1px;
  }
  .modal-actions{
    display:flex; justify-content:flex-end; gap:10px; margin-top:24px;
  }
  .error-msg{
    background:rgba(166,38,57,0.1);
    color:var(--granadina-oscura);
    font-size:13px;
    padding:10px 12px;
    border-radius:3px;
    margin-bottom:16px;
  }
  .hint-credenciales{
    margin-top:20px;
    font-size:12px;
    color:var(--tinta-suave);
    border-top:1px dashed var(--linea);
    padding-top:14px;
  }
  .close-x{
    position:absolute; top:14px; right:16px;
    background:none; border:none; cursor:pointer;
    font-size:20px; color:var(--tinta-suave); line-height:1;
  }
  .modal{ position:relative; }

  /* ---------- ADMIN ---------- */
  #vista-admin{ display:none; }
  #vista-admin.activa{ display:block; }
  #vista-publica.oculta{ display:none; }

  .admin-header{
    padding:40px 0 28px;
    border-bottom:1px solid var(--linea);
  }
  .admin-header .kicker{
    font-size:13px; color:var(--parron); font-weight:600; margin-bottom:8px;
  }
  .admin-header h1{ font-size:34px; }
  .admin-header p{ color:var(--tinta-suave); margin-top:10px; max-width:56ch; font-size:15px;}

  .admin-toolbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:34px 0 18px;
    gap:16px;
    flex-wrap:wrap;
  }
  .admin-toolbar .filtro-cat select{
    padding:9px 12px;
    border-radius:3px;
    border:1px solid var(--linea);
    font-size:13px;
    background:#fff;
  }

  table.tabla-productos{
    width:100%;
    border-collapse:collapse;
    font-size:14px;
    margin-bottom:60px;
  }
  table.tabla-productos th{
    text-align:left;
    font-size:12px;
    text-transform:none;
    color:var(--tinta-suave);
    font-weight:600;
    padding:0 12px 10px;
    border-bottom:1px solid var(--tinta);
  }
  table.tabla-productos td{
    padding:16px 12px;
    border-bottom:1px solid var(--linea);
    vertical-align:top;
  }
  table.tabla-productos td.nombre-cell{ display:flex; gap:12px; align-items:flex-start; }
  table.tabla-productos td.nombre-cell .foto-mini{
    width:52px; height:52px; flex:none; border-radius:3px; overflow:hidden; background:var(--linea);
  }
  table.tabla-productos td.nombre-cell .foto-mini img{ width:100%; height:100%; object-fit:cover; }
  table.tabla-productos td.nombre-cell strong{ display:block; font-size:15px; }
  table.tabla-productos td.nombre-cell span{ font-size:13px; color:var(--tinta-suave); }
  .estado-pill{
    display:inline-block;
    font-size:11px;
    padding:3px 9px;
    border-radius:100px;
    font-weight:600;
  }
  .estado-pill.on{ background:rgba(92,107,71,0.15); color:var(--parron); }
  .estado-pill.off{ background:rgba(166,38,57,0.1); color:var(--granadina-oscura); }
  .fila-acciones{ display:flex; gap:8px; }

  .form-modal-wide{ max-width:560px; }
  .form-grid-2{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:0 16px;
  }

  @media (max-width: 760px){
    .header-inner{ flex-wrap:wrap; }
    nav.main-nav{ order:3; width:100%; justify-content:space-between; padding-top:10px; border-top:1px solid var(--linea); margin-top:10px;}
    .hero-inner{ grid-template-columns:1fr; }
    .hero-figure{ order:-1; }
    .receta{ grid-template-columns:1fr; }
    .receta .paso{ border-right:none; border-bottom:1px solid var(--linea); }
    .form-grid-2{ grid-template-columns:1fr; }
    table.tabla-productos thead{ display:none; }
    table.tabla-productos, table.tabla-productos tbody, table.tabla-productos tr, table.tabla-productos td{ display:block; width:100%; }
    table.tabla-productos tr{ border-bottom:2px solid var(--tinta); padding:12px 0; }
    table.tabla-productos td{ border-bottom:none; padding:4px 0; }
  }

nav.main-nav{flex-wrap:wrap;gap:14px}.overlay .modal{max-height:90vh;overflow-y:auto}.login-page{min-height:100vh}.login-page .modal{max-height:none} :focus-visible{outline:2px solid var(--bandera);outline-offset:3px}@media(max-width:480px){.header-inner,.wrap{padding-left:16px;padding-right:16px}.brand{flex-wrap:wrap}.modal{padding:28px 20px}.fila-acciones{flex-wrap:wrap}.cart-row{gap:8px}}
[hidden]{display:none !important;}
#overlay-login .close-x{position:absolute;top:14px;right:16px;text-decoration:none} #overlay-login .btn-ghost{color:#fff;border-color:#fff} .login-page{background:var(--crema)} @media(max-width:480px){.menu-item .fila-principal{flex-direction:column;align-items:flex-start;gap:12px}.menu-item .precio{display:flex;align-items:center;gap:12px}.menu-item .info{min-width:0}}

</style></head><body><div class="overlay login-page" id="overlay-login">
  <div class="modal">
    <a class="close-x" href="index.html" aria-label="Volver al inicio">&times;</a>
    <h2>Iniciar sesión</h2>
    <p class="sub">Acceso para administrar la carta de productos.</p>
    <div class="error-msg hidden" id="login-error">Usuario o contraseña incorrectos.</div>
    <form id="form-login">
      <div class="campo">
        <label for="login-user">Usuario</label>
        <input type="text" id="login-user" autocomplete="username" placeholder="admin">
      </div>
      <div class="campo">
        <label for="login-pass">Contraseña</label>
        <input type="password" id="login-pass" autocomplete="current-password" placeholder="••••••••">
      </div>
      <div class="modal-actions">
        <a class="btn btn-ghost btn-small" href="index.html">Volver al inicio</a>
        <button type="submit" class="btn btn-primary btn-small">Entrar</button>
      </div>
    </form>
    <div class="hint-credenciales">Demostración local. Configura el acceso siguiendo README.md. No uses contraseñas reales.</div>
  </div>
</div>

<script src="config.local.js"></script>
<script>

const $ = id => document.getElementById(id);
const SEED_PRODUCTOS = [

    { id: 3, nombre: "Piscola", categoria: "Tragos", precio: 7890, desc: "Pisco con bebida cola, al gusto.", disponible: true, foto: "img/piscola.jpg" },

    { id: 5, nombre: "Anticuchos", categoria: "Piqueos", precio: 15000, desc: "Brochetas de carne a la parrilla con verduras.", disponible: true, foto: "img/anticuchos.jpg" },

const KEY_PRODUCTOS='terremoto_productos_v1', KEY_SESION='terremoto_sesion_v1';
function leerJSON(storage,key,fallback){try{return JSON.parse(storage.getItem(key)) ?? fallback;}catch(e){return fallback;}}
function cargarProductos(){const p=leerJSON(localStorage,KEY_PRODUCTOS,null);return Array.isArray(p)&&p.every(x=>Number.isInteger(x.id)&&typeof x.nombre==='string'&&Number.isFinite(x.precio))?p:structuredClone(SEED_PRODUCTOS);}
function leerSesion(){const s=leerJSON(sessionStorage,KEY_SESION,null);return s&&s.usuario==='admin'&&s.rol==='admin'&&s.expira>Date.now()?s:null;}
function exigirSesion(){if(!leerSesion()){location.replace('login.html');return false;}return true;}
